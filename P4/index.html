<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="charset">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1 id="StoreTitle">ShopEase</h1>
        <nav>
            <ul id="navigation">
                <li>Home</li>
                <li>Products</li>
                <li>Offers</li>
                <li>Contact</li>
            </ul>
        </nav>
        <div class="header-buttons">
            <button id="themebin">Dark Mode</button>
            <button id="cartBtn">
                Cart (<span id="cartCount">0</span>)
            </button>
        </div>
    </header>
</body>
<div style="text-align:center; margin-top:20px;">
    <button id="menuBtn">
        + Show Menu
    </button>
    <ul id="MenuItems">
        <li>Electronics</li>
        <li>Fashion</li>
        <li>Home Appliances</li>
        <li>Accessories</li>
    </ul>
</div>

<section class="hero">
    <h2 id="WelcomeText">
        Welcome to ShopEase
    </h2>
    <p id="description">
        Discover amazing products at affordable prices.
    </p>
    <div class="Search-Box">
        <input type="text" id="SearchInput" placeholder="Search Products...">
        <div id="SearchMessage" class="message"></div>
    </div>
</section>

<section class="products">
    <h2>Featured Products</h2>
    <div id="ProductContainer">
        <div class="Product-Card">
            <img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?q=80&w=725&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="Running Shoes">
            <h3>Running Shoes</h3>
            <p class="price">2,599</p>
            <button class="AddCart">
                Add To Cart
            </button>
        </div>
        <div class="Product-Card">
            <img src="https://images.unsplash.com/photo-1740711152088-88a009e877bb?q=80&w=580&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="Shirt">
            <h3>Shirt</h3>
            <p class="price">4,999</p>
            <button class="AddCart">
                Add To Cart
            </button>
        </div>
        <div class="Product-Card">
            <img src="https://images.unsplash.com/photo-1542496658-e33a6d0d50f6?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="Watch">
            <h3>Watch</h3>
            <p class="price">9,999</p>
            <button class="AddCart">
                Add To Cart
            </button>
        </div>
        <div class="Product-Card">
            <img src="https://images.unsplash.com/photo-1523206489230-c012c64b2b48?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="SmartPhone">
            <h3>SmartPhone</h3>
            <p class="price">9,999</p>
            <button class="AddCart">
                Add To Cart
            </button>
        </div>

    </div>
</section>

<section class="contact-section">
    <h2>Customer Feedback</h2>
    <form id="feedbackform">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter your name">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email">
        <label for="category">Product Category</label>
        <select id="category">
            <option value="">Select category</option>
            <option value="electronics">Electronics</option>
            <option value="fashion">Fashion</option>
            <option value="accessories">Accessories</option>
        </select>
        <button type="submit">Submit Feedback</button>
        <div id="formMessage"></div>
    </form>
</section>

</html>
